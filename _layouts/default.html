<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <style>
      @media print {
        @page { margin: 12mm; }
        .container-lg { max-width: none; margin: 0 !important; padding: 0 !important; }
        .markdown-body { font-size: 12px; }
        .markdown-body hr { height: 2px; margin: 10px 0; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h3 + p { break-after: avoid; }
        .markdown-body h2, .markdown-body h3 { margin-top: 10px; margin-bottom: 8px; }
        .markdown-body p, .markdown-body ul, .markdown-body table { margin-bottom: 8px; }
        .markdown-body li > p { margin-bottom: 4px; }
        .markdown-body td, .markdown-body th { padding: 4px 10px; }
        .markdown-body li, .markdown-body tr { break-inside: avoid; }
        .markdown-body code { white-space: nowrap; }
        .markdown-body td:first-child { white-space: nowrap; }
      }
    </style>
  </head>
  <body>
    <div class="container-lg px-3 my-3 markdown-body">
      {{ content }}
    </div>
  </body>
</html>
